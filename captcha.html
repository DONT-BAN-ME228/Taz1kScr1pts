<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .box { background: #1a1a1a; border: 2px solid #ff4444; border-radius: 12px; padding: 40px; text-align: center; max-width: 400px; width: 90%; }
        .box h2 { color: #ff4444; margin-bottom: 15px; }
        .code { background: #111; border: 1px solid #333; border-radius: 8px; padding: 20px; font-size: 28px; font-weight: bold; letter-spacing: 5px; margin-bottom: 20px; font-family: 'Courier New', monospace; }
        input { width: 100%; padding: 14px; background: #111; border: 2px solid #333; border-radius: 8px; color: #fff; font-size: 20px; text-align: center; outline: none; margin-bottom: 15px; text-transform: uppercase; }
        input:focus { border-color: #ff4444; }
        button { width: 100%; padding: 14px; background: #ff4444; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #ff6666; }
        .error { color: #ff4444; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🤖 Проверка на робота</h2>
        <p style="color: #888; margin-bottom: 15px;">Введите код чтобы продолжить</p>
        <div class="code" id="code">ABC123</div>
        <input type="text" id="input" placeholder="Код" maxlength="6">
        <button onclick="check()">Подтвердить</button>
        <div class="error" id="error">❌ Неверный код!</div>
    </div>
    
    <script>
        var captchaCode = "";
        
        function generate() {
            var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            captchaCode = "";
            for (var i = 0; i < 6; i++) {
                captchaCode += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('code').textContent = captchaCode;
            document.getElementById('input').value = "";
            document.getElementById('error').style.display = 'none';
        }
        
        function check() {
            var input = document.getElementById('input').value.toUpperCase();
            
            if (input === captchaCode) {
                window.location.href = 'index.html';
            } else {
                document.getElementById('error').style.display = 'block';
                generate();
            }
        }
        
        document.getElementById('input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') check();
        });
        
        generate();
    </script>
</body>
</html>
